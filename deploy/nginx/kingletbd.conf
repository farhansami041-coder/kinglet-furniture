# ============================================================
# NGINX PRODUCTION CONFIGURATION FOR KINGLET FURNITURE & INTERIOR
# Domain: kingletbd.com & www.kingletbd.com
# Destination: /etc/nginx/sites-available/kingletbd.conf
# Symlink: sudo ln -s /etc/nginx/sites-available/kingletbd.conf /etc/nginx/sites-enabled/
# ============================================================

# Rate limiting zone for public API protection (30 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=kinglet_api_limit:10m rate=30r/s;

# 1. HTTP Server: Redirect all traffic to HTTPS (301 Permanent)
server {
    listen 80;
    listen [::]:80;
    server_name kingletbd.com www.kingletbd.com;

    # Certbot challenge directory for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kingletbd.com www.kingletbd.com;

    # SSL Certificate Paths (Automated via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/kingletbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kingletbd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend Single Page Application (SPA) Root
    root /var/www/kinglet/dist;
    index index.html;

    # Maximum file upload size for high-resolution 4K furniture photos
    client_max_body_size 35M;

    # Gzip Compression Optimization for ultra-fast loading over 4G/5G/Broadband
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # A. Static Asset Cache Optimization (Hashed Vite Bundles)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # B. Local Object Storage Uploads (Direct static serve for maximum speed; ^~ disables regex override)
    location ^~ /storage/ {
        alias /var/www/kinglet/server/storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # C. REST API Reverse Proxy -> Node.js Express Backend
    location /api/ {
        limit_req zone=kinglet_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # D. Frontend SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

